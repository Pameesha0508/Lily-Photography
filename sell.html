<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell your work | Lumen Photos</title>
<meta name="description" content="Lumen Photos: license photos from independent Sri Lankan photographers, or sell your own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Outfit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header glass">
  <a class="brand" href="index.html">Lumen Photos</a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  <nav id="nav" class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="portfolio.html">Shop</a>
    <a href="sell.html" aria-current="page">Sell your work</a>
    <a href="contact.html">Contact</a>
    <button id="themeBtn" class="pill" aria-label="Toggle dark mode">Dark mode</button>
  </nav>
</header>
<main id="main">
  <section class="section narrow">
    <h1>Sell your work</h1>
    <p>List a photo in the shop. Your listing is saved in this browser for the demo.</p>
    <form id="sellForm" class="glass form-card" novalidate>
      <div class="field"><label for="seller">Photographer name</label><input id="seller" name="seller" type="text" required><span class="error" id="sellerError" role="alert"></span></div>
      <div class="field"><label for="title">Photo title</label><input id="title" name="title" type="text" required><span class="error" id="titleError" role="alert"></span></div>
      <div class="field"><label for="category">Category</label>
        <select id="category" name="category"><option>Coastline</option><option>Hill country</option><option>Wildlife</option><option>Street</option></select></div>
      <div class="field"><label for="price">Base price in USD (Personal licence; Commercial is 2.5x, Extended 5x)</label><input id="price" name="price" type="number" min="1" step="0.01" required><span class="error" id="priceError" role="alert"></span></div>
      <div class="field"><label for="description">Description</label><textarea id="description" name="description" rows="3"></textarea></div>
      <div class="field"><label for="photo">Photo file (JPG or PNG)</label><input id="photo" name="photo" type="file" accept="image/*" required><span class="error" id="photoError" role="alert"></span></div>
      <button class="btn" type="submit">List my photo</button>
      <p id="sellStatus" class="status" role="status"></p>
    </form>
  </section>
</main>
<footer class="site-footer">
  <p>&copy; 2026 Lumen Photos. A fictional shop for a class project; no real payments are taken.</p>
  <p><a href="contact.html">hello@lumenprints.example</a></p>
</footer>
<script src="js/nav.js"></script>
<script src="js/sell.js"></script>
</body>
</html>
