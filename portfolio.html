<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Lily Photography</title>
<meta name="description" content="Lumen Photos: license photos from independent Sri Lankan photographers, or sell your own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Outfit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header glass">
  <a class="brand" href="index.html">Lumen Photos</a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  <nav id="nav" class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="portfolio.html" aria-current="page">Shop</a>
    <a href="sell.html">Sell your work</a>
    <a href="contact.html">Contact</a>
    <button id="themeBtn" class="pill" aria-label="Toggle dark mode">Dark mode</button>
  </nav>
</header>
<main id="main">
  <section class="section">
    <h1>License a photo</h1>
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    <div class="grid-3" id="gallery" aria-live="polite"><p>Loading photos...</p></div>
  </section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal-box glass">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-art" id="modalArt"></div>
    <h2 id="modalTitle"></h2>
    <p id="modalMeta" class="meta"></p>
    <p id="modalText"></p>
    <div class="buy-row"><span class="price" id="modalPrice"></span><button class="btn small" id="modalAdd">Buy licence</button></div>
  </div>
</div>
<footer class="site-footer">
  <p>&copy; 2026 Lily Photography. A fictional shop for a class project; no real payments are taken.</p>
  <p><a href="contact.html">hello@lilyprints.example</a></p>
</footer>
<script src="js/nav.js"></script>
<script src="js/licence.js"></script>
<script src="js/portfolio.js"></script>
</body>
</html>
