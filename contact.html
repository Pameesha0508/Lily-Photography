<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Lina Fernando Photography</title>
<meta name="description" content="Landscape and coastal photography by Lina Fernando, based in Sri Lanka.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="index.html">Lina Fernando</a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  <nav id="nav" class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html" aria-current="page">Contact</a>
    <button id="themeBtn" class="theme-btn" aria-label="Toggle dark mode">Dark mode</button>
  </nav>
</header>
<main id="main">
  <section class="section narrow">
    <h1>Contact</h1>
    <p>Tell me about your project. I reply within two working days.</p>
    <form id="contactForm" novalidate>
      <div class="field"><label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <span class="error" id="nameError" role="alert"></span></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="error" id="emailError" role="alert"></span></div>
      <div class="field"><label for="topic">Topic</label>
        <select id="topic" name="topic">
          <option>Print purchase</option><option>Commission</option><option>Workshop</option><option>Other</option>
        </select></div>
      <div class="field"><label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <span class="error" id="messageError" role="alert"></span></div>
      <button class="btn" type="submit">Send message</button>
      <p id="formStatus" class="status" role="status"></p>
    </form>
  </section>
</main>
<footer class="site-footer">
  <p>&copy; 2026 Lina Fernando. Fictional client for a class project.</p>
  <p><a href="contact.html">hello@linafernando.example</a></p>
</footer>
<script src="js/nav.js"></script>
<script src="js/validation.js"></script>
</body>
</html>
